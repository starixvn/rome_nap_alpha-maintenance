<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .result {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .success {
            background: #e0ffe0;
        }

        .error {
            background: #ffe0e0;
        }

        .missing-klprod {
            color: red;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
        }

        #summary {
            margin-bottom: 30px;
            padding: 10px;
            border: 2px solid #888;
            background: #f8f8f8;
        }
    </style>
</head>
<body>
    <h1>Health Check</h1>
    <div id="summary"></div>
    <div id="results"></div>
    <script>
        // List of URLs to check
        const urls = [
            'https://mb.logifun.com'
        ];

        const healthcheck = '/auth/health';

        const resultsDiv = document.getElementById('results');
        const summaryDiv = document.getElementById('summary');

        let total = urls.length;
        let successCount = 0;
        let errorCount = 0;
        let missingKLPRODCount = 0;
        let finishedCount = 0;

        function createResultElement(url, status, data, isError, missingKLPROD) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = `<strong>URL:</strong> ${url}<br>
                                         <strong>Status:</strong> ${status}<br>
                                         <strong>Response:</strong>
                                         <pre${missingKLPROD ? ' class="missing-klprod"' : ''}>${data}</pre>`;
            return div;
        }

        function updateSummary() {
            summaryDiv.innerHTML = `<strong>Summary:</strong><br>
                        Total Domains: ${total}<br>
                        Success: ${successCount}<br>
                        Error: ${errorCount}<br>
                        Missing KLPROD: ${missingKLPRODCount}`;
        }

        urls.forEach(url => {
            fetch(`HealthCheck/Proxy?url=${encodeURIComponent(url + healthcheck)}`)
                .then(response => response.text().then(data => {
                    const status = `${response.status} ${response.statusText}`;
                    if (response.status !== 200) {
                        errorCount++;
                        resultsDiv.appendChild(createResultElement(url, status, '', true, false));
                    } else {
                        successCount++;
                        const missingKLPROD = !data.includes("KLPROD");
                        if (missingKLPROD) missingKLPRODCount++;
                        resultsDiv.appendChild(createResultElement(url, status, data, false, missingKLPROD));
                    }
                    finishedCount++;
                    if (finishedCount === total) updateSummary();
                }))
                .catch(error => {
                    errorCount++;
                    finishedCount++;
                    resultsDiv.appendChild(createResultElement(url, 'Error', error, true, false));
                    if (finishedCount === total) updateSummary();
                });
        });
    </script>
</body>
</html>
